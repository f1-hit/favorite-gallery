<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Favorites</title>

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================================
         HEADER
    ================================= -->

    <header class="site-header">
        <div class="header-inner">

            <h1>My Favorites</h1>

            <div class="header-actions">

                <div class="header-actions">

    <button
        id="done-button"
        class="icon-button hidden"
        type="button"
        aria-label="Done managing"
        title="Done"
    >
        ✓
    </button>

    <button
        id="add-button"
        class="icon-button"
        type="button"
        aria-label="Add favorite"
        title="Add favorite"
    >
        +
    </button>

    <button
        id="manage-button"
        class="icon-button"
        type="button"
        aria-label="Manage favorites"
        title="Manage favorites"
    >
        ⋮
    </button>

</div>

                

            </div>

        </div>
    </header>


    <!-- ================================
         GALLERY
    ================================= -->

    <main class="gallery-container">

        <div id="gallery" class="gallery">

            <div class="loading-state">
                Loading favorites...
            </div>

        </div>

    </main>


    <!-- ================================
         LOGIN MODAL
    ================================= -->

    <div
        id="login-modal"
        class="modal-overlay hidden"
    >

        <div
            class="modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="login-title"
        >

            <div class="modal-header">

                <div>
                    <h2 id="login-title">
                        Management
                    </h2>

                    <p>
                        Sign in to manage your favorites.
                    </p>
                </div>

                <button
                    id="login-close"
                    class="modal-close"
                    type="button"
                    aria-label="Close"
                >
                    ×
                </button>

            </div>


            <form id="login-form">

                <label for="login-email">
                    Email
                </label>

                <input
                    id="login-email"
                    type="email"
                    autocomplete="username"
                    required
                >


                <label for="login-password">
                    Password
                </label>

                <input
                    id="login-password"
                    type="password"
                    autocomplete="current-password"
                    required
                >


                <p
                    id="login-error"
                    class="form-error hidden"
                ></p>


                <button
                    id="login-submit"
                    class="primary-button"
                    type="submit"
                >
                    Sign in
                </button>

            </form>

        </div>

    </div>

<!-- ================================
     VIDEO VAULT MODAL
================================= -->

<div
    id="video-modal"
    class="modal-overlay hidden"
>

    <div
        class="modal video-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="video-title"
    >

        <div class="modal-header">

            <div>
                <h2 id="video-title">
                    Videos
                </h2>

                <p id="video-subtitle">
                    Favorite videos
                </p>
            </div>

            <div class="video-header-actions">

                <button
                    id="video-add-button"
                    class="video-add-button hidden"
                    type="button"
                >
                    + Add Video
                </button>

                <button
                    id="video-close"
                    class="modal-close"
                    type="button"
                    aria-label="Close"
                >
                    ×
                </button>

            </div>

        </div>

        <div
            id="video-list"
            class="video-list"
        >
        </div>

    </div>

</div>


<!-- ================================
     ADD VIDEO POPUP
================================= -->

<div
    id="add-video-modal"
    class="modal-overlay hidden"
>

    <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="add-video-title"
    >

        <div class="modal-header">

            <div>
                <h2 id="add-video-title">
                    Add Video
                </h2>

                <p>
                    Paste the video page URL.
                </p>
            </div>

            <button
                id="add-video-close"
                class="modal-close"
                type="button"
                aria-label="Close"
            >
                ×
            </button>

        </div>

        <form id="add-video-form">

            <div class="form-group">

                <label for="video-url">
                    Video URL
                </label>

                <input
                    id="video-url"
                    type="url"
                    placeholder="https://example.com/video"
                    required
                >

            </div>

            <div class="form-actions">

                <button
                    id="add-video-cancel"
                    type="button"
                    class="secondary-button"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="primary-button"
                >
                    Add Video
                </button>

            </div>

        </form>

    </div>

</div>


<script
    type="module"
    src="app.js"
></script>


<!-- ================================
     ADD FAVORITE MODAL
================================= -->

<div
    id="add-modal"
    class="modal-overlay hidden"
>

    <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="add-title"
    >

        <div class="modal-header">

            <div>
                <h2 id="add-title">
                    Add Favorite
                </h2>

                <p>
                    Add a name and image URL.
                </p>
            </div>

            <button
                id="add-close"
                class="modal-close"
                type="button"
                aria-label="Close"
            >
                ×
            </button>
        </div>


            <form id="add-form">

                <label for="favorite-name">
                    Name
                </label>

                <input
                    id="favorite-name"
                    type="text"
                    placeholder="Enter name"
                    autocomplete="off"
                    maxlength="100"
                    required
                >


                <label for="favorite-image-url">
                    Image URL
                </label>

                <input
                    id="favorite-image-url"
                    type="url"
                    placeholder="https://example.com/image.jpg"
                    autocomplete="off"
                    required
                >


                <!-- LIVE PREVIEW -->

                <div
                    id="image-preview"
                    class="image-preview hidden"
                >

                    <img
                        id="preview-image"
                        alt="Image preview"
                    >

                </div>


                <p
                    id="add-error"
                    class="form-error hidden"
                ></p>


                <div class="modal-actions">

                    <button
                        id="add-cancel"
                        class="secondary-button"
                        type="button"
                    >
                        Cancel
                    </button>

                    <button
                        id="add-submit"
                        class="primary-button"
                        type="submit"
                    >
                        Add Favorite
                    </button>

                </div>

            </form>

        </div>

    </div>
</body>
</html>
