<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Fav</title>

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================================
         HEADER
    ================================= -->

    <header class="site-header">
        <div class="header-inner">

            <h1>My Fav</h1>

            <div class="header-actions">

    <!-- Saved Sites -->
    <button
        id="bookmark-button"
        class="icon-button"
        type="button"
        aria-label="Saved Sites"
        title="Saved Sites"
    >
        <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
        >
            <path
                d="M6.5 4.5
                   A2.5 2.5 0 0 1 9 2
                   H15
                   A2.5 2.5 0 0 1 17.5 4.5
                   V20
                   L12 16.5
                   L6.5 20
                   Z"
            ></path>
        </svg>
    </button>

    <!-- Fixed Sort Control -->
    <div class="sort-control">

        <div
            id="sort-options"
            class="sort-options hidden"
        >
            <button
                id="shuffle-button"
                class="sort-option"
                type="button"
                aria-label="Shuffle favorites"
                title="Shuffle"
            >
                &#8644;
            </button>

            <button
                id="alphabetical-button"
                class="sort-option"
                type="button"
                aria-label="Sort alphabetically"
                title="A to Z"
            >
                Aa
            </button>

            <button
                id="rating-sort-button"
                class="sort-option"
                type="button"
                aria-label="Sort by rating"
                title="Rating: High to Low"
            >
                &#9733;
            </button>
        </div>

        <button
            id="sort-button"
            class="icon-button"
            type="button"
            aria-label="Sort favorites"
            title="Sort favorites"
        >
            <span
                class="sort-button-icon sort-icon"
                aria-hidden="true"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M8 5V19"></path>
                    <path d="M5 8L8 5L11 8"></path>
                    <path d="M16 19V5"></path>
                    <path d="M13 16L16 19L19 16"></path>
                </svg>
            </span>

            <span
                class="sort-button-icon close-icon"
                aria-hidden="true"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M7 7L17 17"></path>
                    <path d="M17 7L7 17"></path>
                </svg>
            </span>
        </button>

    </div>

    <!-- Manage -->
    <button
        id="manage-button"
        class="icon-button"
        type="button"
        aria-label="Manage favorites"
        title="Manage favorites"
    >
        <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
        >
            <path d="M4 6H20"></path>
            <path d="M4 12H20"></path>
            <path d="M4 18H20"></path>

            <circle
                cx="9"
                cy="6"
                r="1.8"
            ></circle>

            <circle
                cx="15"
                cy="12"
                r="1.8"
            ></circle>

            <circle
                cx="11"
                cy="18"
                r="1.8"
            ></circle>
        </svg>
    </button>

    <button
        id="add-button"
        class="icon-button hidden"
        type="button"
        aria-label="Add favorite"
        title="Add favorite"
    >
        +
    </button>

    <button
        id="done-button"
        class="icon-button hidden"
        type="button"
        aria-label="Done managing"
        title="Done"
    >
        &#10003;
    </button>

</div>

</div>
</header>


    <!-- ================================
         GALLERY
    ================================= -->

    <main class="gallery-container">

        <div id="gallery" class="gallery">

            <div class="loading-state">
                Loading favorites...
            </div>

        </div>

    </main>


    <!-- ================================
         LOGIN MODAL
    ================================= -->

    <div
        id="login-modal"
        class="modal-overlay hidden"
    >

        <div
            class="modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="login-title"
        >

            <div class="modal-header">

                <div>
                    <h2 id="login-title">
                        Management
                    </h2>

                    <p>
                        Sign in to manage your favorites.
                    </p>
                </div>

                <button
                    id="login-close"
                    class="modal-close"
                    type="button"
                    aria-label="Close"
                >
    &#215;
</button>

            </div>


            <form id="login-form">

                <label for="login-email">
                    Email
                </label>

                <input
                    id="login-email"
                    type="email"
                    autocomplete="username"
                    required
                >


                <label for="login-password">
                    Password
                </label>

                <input
                    id="login-password"
                    type="password"
                    autocomplete="current-password"
                    required
                >


                <p
                    id="login-error"
                    class="form-error hidden"
                ></p>


                <button
                    id="login-submit"
                    class="primary-button"
                    type="submit"
                >
                    Sign in
                </button>

            </form>

        </div>

    </div>

<!-- ================================
     VIDEO VAULT MODAL
================================= -->

<div
    id="video-modal"
    class="modal-overlay hidden"
>

    <div
        class="modal video-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="video-title"
    >

        <div class="modal-header">

            <div>
                <h2 id="video-title">
                    Videos
                </h2>

                <p id="video-subtitle">
                    Items
                </p>
            </div>

            <div class="video-header-actions">

                <button
                    id="video-add-button"
                    class="video-add-button hidden"
                    type="button"
                >
                    + Add
                </button>

                <button
                    id="video-close"
                    class="modal-close"
                    type="button"
                    aria-label="Close"
                >
    &#215;
</button>

            </div>

        </div>

        <div
            id="video-list"
            class="video-list"
        >
        </div>

    </div>

</div>


<!-- ================================
     ADD VIDEO POPUP
================================= -->

<div
    id="add-video-modal"
    class="modal-overlay hidden"
>

    <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="add-video-title"
    >

        <div class="modal-header">

            <div>
                <h2 id="add-video-title">
                    Add Item
                </h2>

                <p>
                    Paste the page URL.
                </p>
            </div>

            <button
                id="add-video-close"
                class="modal-close"
                type="button"
                aria-label="Close"
            >
    &#215;
</button>

        </div>

        <form id="add-video-form">

            <div class="form-group">

                <label for="video-url">
                    Page URL
                </label>

                <input
                    id="video-url"
                    type="url"
                    placeholder="https://example.com/video"
                    required
                >

            </div>

            <div class="form-actions">

                <button
                    id="add-video-cancel"
                    type="button"
                    class="secondary-button"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="primary-button"
                >
                    Add Item
                </button>

            </div>

        </form>

    </div>

</div>


<script
    type="module"
    src="app.js"
></script>


<!-- ================================
     ADD FAVORITE MODAL
================================= -->

<div
    id="add-modal"
    class="modal-overlay hidden"
>

    <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="add-title"
    >

        <div class="modal-header">

            <div>
                <h2 id="add-title">
                    Add Favorite
                </h2>

                <p>
                    Add a name and image URL.
                </p>
            </div>

            <button
                id="add-close"
                class="modal-close"
                type="button"
                aria-label="Close"
            >
    &#215;
</button>
        </div>


            <form id="add-form">

                <label for="favorite-name">
                    Name
                </label>

                <input
                    id="favorite-name"
                    type="text"
                    placeholder="Enter name"
                    autocomplete="off"
                    maxlength="100"
                    required
                >


                <label for="favorite-image-url">
    Image URL
</label>

<input
    id="favorite-image-url"
    type="url"
    placeholder="https://example.com/image.jpg"
    autocomplete="off"
    required
>


<label for="favorite-rating">
    Rating <span class="optional-label">(optional)</span>
</label>

<input
    id="favorite-rating"
    type="number"
    min="0"
    max="10"
    step="0.1"
    inputmode="decimal"
    placeholder="0-10"
>


<!-- LIVE PREVIEW -->

                <div
                    id="image-preview"
                    class="image-preview hidden"
                >

                    <img
                        id="preview-image"
                        alt="Image preview"
                    >

                </div>


                <p
                    id="add-error"
                    class="form-error hidden"
                ></p>


                <div class="modal-actions">

                    <button
                        id="add-cancel"
                        class="secondary-button"
                        type="button"
                    >
                        Cancel
                    </button>

                    <button
                        id="add-submit"
                        class="primary-button"
                        type="submit"
                    >
                        Add Favorite
                    </button>

                </div>

            </form>

        </div>

    </div>
</body>
</html>
